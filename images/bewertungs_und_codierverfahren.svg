<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L0,6 L9,3 z" fill="#174786"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="800" y="68" text-anchor="middle" fill="#123B78" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">Bewertungs- und Codierverfahren</text>
<rect x="55" y="112" width="300" height="112" rx="10" fill="#F8FAFD" stroke="#174786" stroke-width="2"/>
<text x="205" y="153" text-anchor="middle" fill="#17345E" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700"><tspan x="205" dy="0">1. Interviewantwort /</tspan><tspan x="205" dy="26.2">Rohdaten</tspan></text>
<rect x="420" y="112" width="300" height="112" rx="10" fill="#F8FAFD" stroke="#174786" stroke-width="2"/>
<text x="570" y="153" text-anchor="middle" fill="#17345E" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700"><tspan x="570" dy="0">2. Atomisierung in</tspan><tspan x="570" dy="25.0">semantisch eigenständige</tspan><tspan x="570" dy="25.0">Aussagen</tspan></text>
<rect x="785" y="112" width="300" height="112" rx="10" fill="#F8FAFD" stroke="#174786" stroke-width="2"/>
<text x="935" y="153" text-anchor="middle" fill="#17345E" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700"><tspan x="935" dy="0">3. Referenzfakten</tspan><tspan x="935" dy="26.2">(Soll)</tspan></text>
<line x1="355" y1="168" x2="410" y2="168" stroke="#174786" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<line x1="720" y1="168" x2="775" y2="168" stroke="#174786" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="75" y="254" text-anchor="start" fill="#66707D" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" font-style="italic">Gesamter Inhalt der Interviewantwort.</text>
<text x="450" y="254" text-anchor="start" fill="#66707D" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" font-style="italic"><tspan x="450" dy="0">Aufteilung in einzelne,</tspan><tspan x="450" dy="20.0">semantisch eigenständige Fakten.</tspan></text>
<text x="815" y="254" text-anchor="start" fill="#66707D" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" font-style="italic"><tspan x="815" dy="0">Menge aller atomaren Referenzfakten</tspan><tspan x="815" dy="20.0">als Bewertungsstandard.</tspan></text>
<rect x="55" y="342" width="300" height="112" rx="10" fill="#F8FAFD" stroke="#174786" stroke-width="2"/>
<text x="205" y="383" text-anchor="middle" fill="#17345E" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700"><tspan x="205" dy="0">1. Agentenausgabe /</tspan><tspan x="205" dy="26.2">Ergebnisdatei</tspan></text>
<rect x="420" y="342" width="300" height="112" rx="10" fill="#F8FAFD" stroke="#174786" stroke-width="2"/>
<text x="570" y="383" text-anchor="middle" fill="#17345E" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700"><tspan x="570" dy="0">2. Atomisierung der</tspan><tspan x="570" dy="25.0">Ausgabebehauptungen</tspan></text>
<line x1="355" y1="398" x2="410" y2="398" stroke="#174786" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="75" y="486" text-anchor="start" fill="#66707D" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" font-style="italic">Gesamte Ausgabe des Systems oder Agenten.</text>
<text x="450" y="486" text-anchor="start" fill="#66707D" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" font-style="italic"><tspan x="450" dy="0">Aufteilung der Ausgabe in atomare</tspan><tspan x="450" dy="20.0">Ausgabebehauptungen.</tspan></text>
<rect x="770" y="342" width="340" height="136" rx="10" fill="#EEF4FA" stroke="#174786" stroke-width="2"/>
<text x="940" y="395" text-anchor="middle" fill="#17345E" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700"><tspan x="940" dy="0">Vergleich von</tspan><tspan x="940" dy="31.2">Referenz und Ausgabe</tspan></text>
<polyline points="935,224 935,300 890,300 890,342" stroke="#174786" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<line x1="720" y1="398" x2="760" y2="398" stroke="#174786" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="1180" y="310" width="350" height="76" rx="10" fill="#E8F4E8" stroke="#2E7D32" stroke-width="2"/>
<text x="1355.0" y="342" text-anchor="middle" fill="#17345E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1355.0" dy="0">TP: korrekt übernommener Fakt</tspan></text>
<rect x="1180" y="410" width="350" height="76" rx="10" fill="#FFF4D8" stroke="#D69400" stroke-width="2"/>
<text x="1355.0" y="442" text-anchor="middle" fill="#17345E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1355.0" dy="0">FN: fehlender oder</tspan><tspan x="1355.0" dy="22.5">abgeschwächter Fakt</tspan></text>
<rect x="1180" y="510" width="350" height="76" rx="10" fill="#FCE8E6" stroke="#C43C32" stroke-width="2"/>
<text x="1355.0" y="542" text-anchor="middle" fill="#17345E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1355.0" dy="0">FP: unbelegte zusätzliche</tspan><tspan x="1355.0" dy="22.5">Behauptung</tspan></text>
<polyline points="1110,408 1140,408 1140,348 1170,348" stroke="#174786" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<polyline points="1110,408 1140,408 1140,448 1170,448" stroke="#174786" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<polyline points="1110,408 1140,408 1140,548 1170,548" stroke="#174786" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<line x1="940" y1="478" x2="940" y2="635" stroke="#174786" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="150" y="640" width="1300" height="150" rx="12" fill="#F8FAFD" stroke="#5687C8" stroke-width="2"/>
<text x="185" y="684" text-anchor="start" fill="#123B78" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Verbindliche Codierregeln</text>
<text x="520" y="684" text-anchor="start" fill="#17345E" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">• Synonyme sind zulässig.</text>
<text x="520" y="720" text-anchor="start" fill="#17345E" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">• Negationen bleiben erhalten.</text>
<text x="895" y="684" text-anchor="start" fill="#17345E" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">• Bedingungen und Kausalbeziehungen bleiben Bestandteil des Fakts.</text>
<text x="895" y="720" text-anchor="start" fill="#17345E" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">• Stilistische Unterschiede ohne neue Tatsachenbehauptung zählen nicht als FP.</text>
<line x1="800" y1="790" x2="800" y2="825" stroke="#174786" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="80" y="830" width="1440" height="190" rx="12" fill="#F8FAFD" stroke="#174786" stroke-width="2"/>
<text x="800" y="871" text-anchor="middle" fill="#123B78" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Kennzahlen</text>
<rect x="100" y="900" width="290" height="78" rx="9" fill="#FFFFFF" stroke="#5687C8" stroke-width="2"/>
<text x="245" y="934" text-anchor="middle" fill="#17345E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="245" dy="0">Faktendeckung</tspan><tspan x="245" dy="22.5">(Recall)</tspan></text>
<rect x="450" y="900" width="290" height="78" rx="9" fill="#FFFFFF" stroke="#5687C8" stroke-width="2"/>
<text x="595" y="934" text-anchor="middle" fill="#17345E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="595" dy="0">Präzision</tspan></text>
<rect x="800" y="900" width="290" height="78" rx="9" fill="#FFFFFF" stroke="#5687C8" stroke-width="2"/>
<text x="945" y="934" text-anchor="middle" fill="#17345E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="945" dy="0">Fehlerschwere</tspan></text>
<rect x="1150" y="900" width="290" height="78" rx="9" fill="#FFFFFF" stroke="#5687C8" stroke-width="2"/>
<text x="1295" y="934" text-anchor="middle" fill="#17345E" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan x="1295" dy="0">Laufstabilität zwischen</tspan><tspan x="1295" dy="22.5">Wiederholungen</tspan></text>
<text x="800" y="1068" text-anchor="middle" fill="#66707D" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Grundidee angelehnt an atomare Faktenbewertung (ähnlich FActScore), erweitert um Vollständigkeit gegenüber einem Referenzstandard.</text>
</svg>